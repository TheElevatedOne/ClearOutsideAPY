[project]
name = "clear-outside-api"
version = "3.0.0"
authors = [
  { name = "ELEVATED", email = "admin@elevated.ovh" },
]
description = "clearoutside.com astronomy forecast scraper running as a Cloudflare Python Worker"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/TheElevatedOne/ClearOutsideAPY"
Issues = "https://github.com/TheElevatedOne/ClearOutsideAPY/issues"
Changelog = "https://github.com/TheElevatedOne/ClearOutsideAPY/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
  "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
